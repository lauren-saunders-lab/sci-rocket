name: CI setup
description: "Setup Python, install test deps, download integration test data."

inputs:
  test-data-version:
    description: "Version tag of sci-rocket-test-data release"
    required: false
    default: "2026.01.09"
  python-version:
    description: "Python version"
    required: false
    default: "3.13"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install test dependencies
      shell: bash
      run: python -m pip install snakemake pytest pandas

    - name: Use conda env pin for faster CI builds
      shell: bash
      run: cp tests/integration/sci-rocket.linux-64.pin.txt workflow/envs/.

    - name: Download integration test data
      shell: bash
      run: |
        mkdir -p tests/integration/data
        URL="https://github.com/lauren-saunders-lab/sci-rocket-test-data/releases/download/${{ inputs.test-data-version }}/test-data.tgz"
        wget -O - "$URL" | tar -xvzf - -C tests/integration/data

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - uses: pnpm/action-setup@v4
      with:
        version: "10"
        run_install: false

    - name: Install Playwright
      shell: bash
      working-directory: tests/integration
      run: |
        pnpm install --frozen-lockfile
        pnpm exec playwright install --with-deps chromium
